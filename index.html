<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>26-Day Python Plan</title></head>
<body><p style="font-family:system-ui;padding:2rem">Loading study plan…</p>
<script type="module">
import {c0} from "./c0.js";
import {c1} from "./c1.js";
import {c2} from "./c2.js";
import {c3} from "./c3.js";
import {c4} from "./c4.js";
import {c5} from "./c5.js";
import {c6} from "./c6.js";
import {c7} from "./c7.js";
import {c8} from "./c8.js";
import {c9} from "./c9.js";
import {c10} from "./c10.js";
import {c11} from "./c11.js";
const b64 = c0+c1+c2+c3+c4+c5+c6+c7+c8+c9+c10+c11;
const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
const ds = new DecompressionStream("gzip");
const stream = new Blob([bin]).stream().pipeThrough(ds);
const buf = await new Response(stream).arrayBuffer();
const html = new TextDecoder().decode(buf);
document.open(); document.write(html); document.close();
</script></body></html>
